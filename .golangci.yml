version: "2"
linters:
  default: standard      # errcheck、govet、ineffassign、staticcheck、unused
  enable:
    - errorlint          # 检查 error 的比较和包装是否正确
    - bodyclose          # 检查 HTTP resp.Body 有没有关闭
    - gocritic           # 一批常见写法问题
    - revive             # 代码风格，golint 的继任者
    - misspell           # 英文拼写
formatters:
  enable:
    - gofmt
    - goimports
